{% extends "layout.html" %}

{% block title %}Login — Valorant Coach{% endblock %}

{% block content %}
  <div class="hero">
    <h1>Login</h1>
    <span>Access the dashboard, review saved runs, and browse tips.</span>
  </div>
  <form method="post" action="/login">
    <label>
      Username
      <input type="text" name="username" required autofocus />
    </label>
    <label>
      Password
      <input type="password" name="password" required />
    </label>
    <button type="submit">Log in</button>
  </form>
  {% if message %}
  <div class="message">{{ message }}</div>
  {% endif %}
{% endblock %}
