<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Valorant Tactical Coach{% endblock %}</title>
    <style>
      :root {
        --bg: #0a0e1a;
        --card: #101426;
        --accent: #7c3aed;
        --accent-2: #06b6d4;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --border: #1f2937;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        background: linear-gradient(180deg, #0a0e1a 0%, #070b13 65%, #05080d 100%);
        color: var(--text);
        min-height: 100vh;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 32px;
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        background: rgba(6, 8, 18, 0.9);
        backdrop-filter: blur(8px);
        z-index: 10;
      }
      .brand {
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      nav {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }
      nav a {
        color: var(--muted);
        text-decoration: none;
        font-weight: 500;
        padding: 6px 12px;
        border-radius: 6px;
      }
      nav a.active,
      nav a:hover {
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        color: white;
      }
      main {
        padding: 32px 16px 64px;
        max-width: 1100px;
        margin: 0 auto;
      }
      .panel {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 32px;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.4);
      }
      .panel h1,
      .panel h2 {
        margin: 0 0 16px;
        font-size: 24px;
        letter-spacing: 0.25px;
      }
      form {
        display: grid;
        gap: 12px;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--muted);
      }
      input[type="text"],
      input[type="password"] {
        background: #0b1123;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        color: var(--text);
        font-size: 16px;
      }
      button {
        border: none;
        border-radius: 10px;
        padding: 12px 16px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        color: white;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      }
      .message {
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 8px;
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.25);
        color: #fecaca;
        font-weight: 500;
      }
      .dashboard-frame {
        border: none;
        width: 100%;
        min-height: 640px;
        border-radius: 14px;
        box-shadow: 0 18px 30px rgba(0, 0, 0, 0.5);
        margin-top: 16px;
      }
      .hero {
        margin-bottom: 24px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .hero span {
        color: var(--muted);
        font-size: 14px;
      }
      @media (max-width: 720px) {
        header {
          flex-direction: column;
          align-items: flex-start;
          gap: 12px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">Valorant Tactical Coach — MVP</div>
      <nav>
        <a href="/" class="active">Coach</a>
        {% if user %}
        <a href="/dashboard">Dashboard</a>
        <a href="/logout">Logout</a>
        {% else %}
        <a href="/login">Login</a>
        <a href="/register">Register</a>
        {% endif %}
      </nav>
    </header>
    <main>
      <div class="panel">
        {% block content %}{% endblock %}
      </div>
    </main>
  </body>
</html>
